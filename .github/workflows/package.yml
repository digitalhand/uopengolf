# SPDX-License-Identifier: MIT
# Packages the Development game on self-hosted Unreal runners. Start it from Actions > Package >
# Run workflow and pick the ref under "Use workflow from": a vX.Y.Z tag stamps that version and
# attaches the archives to a draft GitHub Release; a branch gives a test build (artifacts only).
# Each platform can run separately, so Linux and Windows assets can join the same draft later.
#
# This repository is public. Never add pull_request or pull_request_target triggers to this
# workflow, or to any workflow that uses the self-hosted ue-5.8 runners: a fork could then run
# its own code on those machines. See README "CI/CD".
name: Package
run-name: Package ${{ inputs.platform }} @ ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package (its runner must be online)
        type: choice
        options: [linux, windows, both]
        default: linux

permissions:
  contents: read

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Config
            Scripts
      - name: Test release scripts
        working-directory: Scripts
        run: python3 -B -m unittest test_project_version test_check_package_start
      - name: Resolve version
        id: version
        # A tag that is not vX.Y.Z[-prerelease] fails here, before any runner is used.
        run: python3 -B Scripts/project_version.py for-ref "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  package-linux:
    name: Linux package
    needs: prepare
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    runs-on: [self-hosted, Linux, X64, ue-5.8]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # .uasset and .umap files are stored in Git LFS; the runner needs git-lfs installed.
          lfs: true
      - name: Stamp version
        run: python3 -B Scripts/project_version.py stamp "$VERSION"
      - name: Package and start check
        # UE_ROOT comes from the runner's .env file.
        run: bash Scripts/ue.sh package
      - name: Archive
        run: |
          name="UOpenGolf-$VERSION-Linux-x64"
          root="$PWD/Packaged"
          mv "$root/Linux" "$root/$name"
          # The start check leaves its log and this machine's config in Saved/.
          rm -rf -- "$root/$name/UOpenGolf/Saved" "$root/$name/Engine/Saved"
          cp LICENSE THIRD_PARTY_NOTICES.md "$root/$name/"
          mkdir -p "$root/dist"
          owner=(--owner=0 --group=0 --numeric-owner)
          # Keep .sym: the engine reads it to print readable crash call stacks. .debug is for gdb.
          tar -czf "$root/dist/$name.tar.gz" "${owner[@]}" --exclude='*.debug' -C "$root" "$name"
          (cd "$root" && find "$name" -name '*.debug' -print0 >debug-files)
          if [[ -s "$root/debug-files" ]]; then
              tar -czf "$root/dist/$name-symbols.tar.gz" "${owner[@]}" -C "$root" --null -T "$root/debug-files"
          fi
          (cd "$root/dist" && for file in *.tar.gz; do sha256sum "$file" >"$file.sha256"; done)
          ls -l "$root/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uopengolf-linux
          path: Packaged/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload package logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-logs-linux
          path: |
            Saved/Logs/
            Saved/Automation/*-package-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove package files
        if: always()
        run: rm -rf -- Packaged

  package-windows:
    name: Windows package
    needs: prepare
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: [self-hosted, Windows, X64, ue-5.8]
    timeout-minutes: 120
    defaults:
      run:
        # Windows PowerShell's default execution policy blocks the runner's ". '{0}'" template.
        # A custom shell skips the runner's error handling, so each step stops on errors itself.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # .uasset and .umap files are stored in Git LFS; the runner needs git-lfs installed.
          lfs: true
      - name: Stamp version
        run: |
          $ErrorActionPreference = 'Stop'
          # Same engine lookup and bundled Python as Scripts/ue.ps1.
          $engineRoot = if ($env:UE_ROOT) { $env:UE_ROOT } else { Join-Path $env:ProgramFiles 'Epic Games\UE_5.8' }
          $python = Join-Path $engineRoot 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          & $python -B Scripts\project_version.py stamp $env:VERSION
          exit $LASTEXITCODE
      - name: Package and start check
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File Scripts\ue.ps1 Package
          exit $LASTEXITCODE
      - name: Archive
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "UOpenGolf-$env:VERSION-Windows-x64"
          $root = (Resolve-Path -LiteralPath 'Packaged').Path
          $dist = Join-Path $root 'dist'
          Move-Item -LiteralPath (Join-Path $root 'Windows') -Destination (Join-Path $root $name)
          # The start check leaves its log and this machine's config in Saved\.
          foreach ($saved in 'UOpenGolf\Saved', 'Engine\Saved') {
              $path = Join-Path (Join-Path $root $name) $saved
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          }
          Copy-Item -LiteralPath 'LICENSE', 'THIRD_PARTY_NOTICES.md' -Destination (Join-Path $root $name)
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          # Windows' own bsdtar writes zips; Git's GNU tar can come first on PATH.
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          & $tar -a -c -f (Join-Path $dist "$name.zip") --exclude '*.pdb' -C $root $name
          if ($LASTEXITCODE -ne 0) { throw "Creating $name.zip failed (exit $LASTEXITCODE)." }
          # -Filter '*.pdb' also matches longer extensions such as .pdbx, so check the extension too.
          $pdbs = @(Get-ChildItem -LiteralPath (Join-Path $root $name) -Recurse -File -Filter '*.pdb' |
              Where-Object { $_.Extension -eq '.pdb' } |
              ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\', '/') })
          if ($pdbs.Count -gt 0) {
              $list = Join-Path $root 'pdb-files'
              [IO.File]::WriteAllText($list, ($pdbs -join "`n") + "`n")
              & $tar -a -c -f (Join-Path $dist "$name-symbols.zip") -C $root -T $list
              if ($LASTEXITCODE -ne 0) { throw "Creating $name-symbols.zip failed (exit $LASTEXITCODE)." }
          }
          # Same "<hash>  <name>" format as sha256sum, so `sha256sum -c` also works.
          Get-ChildItem -LiteralPath $dist -Filter '*.zip' | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              [IO.File]::WriteAllText("$($_.FullName).sha256", "$hash  $($_.Name)`n")
          }
          Get-ChildItem -LiteralPath $dist | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uopengolf-windows
          path: Packaged/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload package logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-logs-windows
          path: |
            Saved/Logs/
            Saved/Automation/*-package-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove package files
        if: always()
        run: |
          if (Test-Path -LiteralPath 'Packaged') { Remove-Item -LiteralPath 'Packaged' -Recurse -Force }

  # One release job per platform, so each platform's archives reach the draft as soon as that
  # platform finishes, whatever happens to the other one. Both share one concurrency group.
  release-linux:
    name: Draft release (Linux)
    needs: [prepare, package-linux]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uopengolf-linux
          path: dist
      - name: Attach to the draft release
        run: bash Scripts/draft_release.sh "$TAG" "$PRERELEASE" dist/*

  release-windows:
    name: Draft release (Windows)
    needs: [prepare, package-windows]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uopengolf-windows
          path: dist
      - name: Attach to the draft release
        run: bash Scripts/draft_release.sh "$TAG" "$PRERELEASE" dist/*
