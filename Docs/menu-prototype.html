<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UOpenGolf · Menu concept</title>
<style>
:root{color-scheme:dark;--ink:#f0f2e9;--muted:#a9b5ae;--accent:#acc89a}*{box-sizing:border-box}body{margin:0;background:#121917;color:var(--ink);font:18px/1.5 'Segoe UI',sans-serif}body:before{content:'';position:fixed;inset:0;background:linear-gradient(90deg,rgba(9,18,14,.96),rgba(9,18,14,.35)),url('../Assets/Images/public_range.png') center/cover;z-index:-1}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:0;padding:12px 20px;text-align:left;min-height:48px}button:hover{background:#ffffff12}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{display:flex;justify-content:space-between;padding:32px 5vw;border-bottom:1px solid #ffffff20}.brand{letter-spacing:.22em;font-weight:600}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}.muted{color:var(--muted);font-size:14px}#home{padding:10vh 8vw;max-width:800px}h1{font-size:clamp(44px,5vw,76px);font-weight:300;line-height:1.08;margin:18px 0 26px}#home nav{display:grid;margin-top:40px;width:320px}#home nav button{font-size:24px;border-bottom:1px solid #ffffff20;padding-left:0}#home nav button:first-child{color:var(--accent)}#settings{background:#101814f2;min-height:calc(100vh - 100px);padding:28px 5vw}h2{font-weight:300;font-size:36px;margin:0}.top{display:flex;align-items:center;justify-content:space-between;gap:24px}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:40px;margin-top:28px;max-width:1400px}.categories{display:flex;flex-direction:column}.categories button{color:var(--muted);border-left:2px solid transparent}.categories button[aria-pressed=true]{color:var(--ink);background:#acc89a12;border-left-color:var(--accent)}input[type=search]{background:#ffffff08;border:1px solid #ffffff30;padding:12px;color:var(--ink);width:280px}.row{display:flex;justify-content:space-between;align-items:center;gap:30px;border-bottom:1px solid #ffffff12;padding:18px 0}.row label{display:block}.row small{display:block;color:var(--muted);font-size:13px;margin-top:4px;max-width:530px}select{background:#202c25;border:1px solid #ffffff24;border-radius:3px;color:var(--ink);padding:10px;min-width:190px;max-width:260px}footer{display:flex;align-items:center;gap:12px;border-top:1px solid #ffffff20;margin-top:30px;padding-top:20px}.primary{background:var(--accent);color:#142017;border-radius:3px}.primary:hover{background:#c5dfb6}#status{margin-right:auto;color:var(--muted);font-size:14px}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}.note{position:fixed;bottom:16px;right:24px;color:#c6cfc7;font-size:12px}#settings~.note{position:static;text-align:right;padding:10px 5vw}dialog{background:#18241d;color:var(--ink);border:1px solid #acc89a60;max-width:500px;padding:32px}dialog::backdrop{background:#000a}@media(max-width:800px){header{padding:20px}.layout{grid-template-columns:1fr;gap:15px}.categories{flex-direction:row;overflow:auto}.categories button{white-space:nowrap}.top{flex-wrap:wrap}.row{gap:12px}select{min-width:140px;width:42%}footer{flex-wrap:wrap}h1{font-size:48px}}
.version{position:fixed;right:24px;bottom:14px;font-size:12px;letter-spacing:.08em;color:var(--muted);pointer-events:none}body{padding-bottom:38px}
</style>
<header><span class="brand">UOPEN<span style="font-weight:300">GOLF</span></span><span class="muted">LOCAL PLAYER &nbsp; / &nbsp; Device offline</span></header>
<main id="home"><span class="eyebrow">Community golf simulation!</span><h1>Golf for Everyone.</h1><nav aria-label="Main menu"><button data-demo="Training">Training <span style="float:right">↗</span></button><button id="open">Settings</button><button data-demo="Exit UOpenGolf">Exit UOpenGolf</button></nav></main>
<main id="settings" hidden><div class="top"><div><span class="eyebrow">Make it your game</span><h2>Settings</h2></div><input id="search" type="search" aria-label="Search all settings" placeholder="Search all settings…"></div><div class="layout"><nav class="categories" aria-label="Settings categories" id="categories"></nav><section aria-label="Setting controls"><div class="eyebrow" id="section"></div><div id="rows"></div></section></div><footer><span id="status" role="status" aria-live="polite">All changes saved</span><button id="reset">Restore category</button><button id="back">Back</button><button id="discard">Discard</button><button id="apply" class="primary">Apply changes</button></footer></main>
<div class="note">INTERACTIVE DESIGN CONCEPT · Preferences affect this preview only</div>
<div class="version" aria-label="Game version">v0.0.4</div>
<dialog id="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><button id="closeDialog" class="primary">Continue</button></dialog>
<script>
const data={
'Video':[
['Display mode','Borderless|Fullscreen|Windowed','Choose how the game occupies your display.'],
['Resolution','1920 × 1080|2560 × 1440|3840 × 2160','Example display modes; the game must query supported resolutions.'],
['Quality preset','High|Low|Medium|Epic|Custom','Balance course detail and frame rate.'],
['Frame rate limit','60 FPS|120 FPS|144 FPS|Unlimited','A steady frame rate keeps the swing and ball flight clear.'],
['VSync','Off|On','Synchronize presentation with the display.'],
['Render scale','100%|75%|85%','Lower resolution rendering can improve performance.'],
['Global illumination','High|Low|Medium|Epic','Indirect light across terrain and foliage.'],
['Shadows','High|Low|Medium|Epic','Detail and reach of course shadows.'],
['Textures','High|Low|Medium|Epic','Higher settings require more graphics memory.'],
['Foliage','High|Low|Medium|Epic','Grass and vegetation detail.'],
['Motion blur','Off|On','Blur during camera movement.'],
['Depth of field','Off|On','Cinematic focus during presentation.']],
'Audio':[['Master volume','100%|75%|50%|25%|Muted','Overall game volume.'],['Course ambience','75%|100%|50%|25%|Muted','Wind, birds and the surrounding course.'],['Ball & club','100%|75%|50%|25%|Muted','Impact and rolling sounds.'],['Menu sounds','50%|100%|75%|25%|Muted','Quiet feedback for navigation.'],['Dynamic range','Full|Night','Night reduces the difference between quiet and loud sounds.'],['Mute in background','On|Off','Silence the game when another application has focus.']],
'Player':[['Handedness','Right|Left','Player preference; measured launch direction stays unchanged.'],['Distance units','Yards|Meters','Carry, total and distance to the pin.'],['Putting units','Feet|Meters','Short distances on and around the green.'],['Speed units','MPH|KM/H|M/S','Ball, club and wind speed.'],['Club suggestion','On|Off','Suggest a club based on distance.'],['Auto tee delay','3 seconds|5 seconds|8 seconds|Manual','Time to review a shot before the next ball.']],
'Camera & HUD':[['Shot camera','Follow ball|Fixed address|Landing','How you watch ball flight.'],['Cup zoom','On|Off','Move closer as the ball approaches the cup.'],['Ball tracer','Subtle|Full|Off','Keep the ball readable against the sky.'],['Green contours','On demand|Always|Off','Inspect the slopes before putting.'],['Shot data','Essential|Detailed|Minimal','Choose how much feedback appears after a shot.'],['HUD scale','100%|125%|150%','Increase readability on distant simulator screens.']],
'Simulator':[['Preferred device','Square Home|None','Prototype selection; no device connection is made.'],['Auto reconnect','On|Off','Reconnect to the preferred supported device.'],['Square spin mode','Measured|Calculated','Square ball-detection spin mode. Calculated spin must be clearly labeled.'],['Readiness cue','Sound & visual|Visual only','Know when the game can accept the next shot.']],
'Accessibility':[['Text size','Standard|Large|Extra large','Proposed in-game text scaling.'],['High contrast','Off|On','Stronger separation for interface elements.'],['Color palette','Default|Deuteranopia|Protanopia|Tritanopia','Distinct data colors with redundant labels.'],['Reduced motion','On|Off','Limit interface and camera motion.'],['Subtitles','On|Off','Captions for available spoken content.']],
'Game Defaults':[['Gimmie radius','Off|3 ft|5 ft|8 ft|10 ft','Automatically concede a putt within this distance of the cup. Maximum 10 ft; applies to new casual rounds.'],['Mulligans','Off|On','Allow a retry in casual play.'],['Putting mode','Manual|Auto putt','Preferred mode for new rounds when supported.'],['Green speed','Medium|Slow|Fast','Round setup preference.'],['Fairway firmness','Normal|Soft|Firm','Round setup preference.'],['Wind','Course default|Calm|Light|Moderate|Strong','Starting conditions for a new session.'],['Time of day','Course default|Morning|Midday|Evening','Preferred lighting for a new session.']],
'Data & system':[['Shot recording','Off|On','Save launch-monitor sessions in the game.'],['Diagnostic logging','Standard|Verbose','Additional information for troubleshooting.'],['Recording retention','Keep all|30 days|90 days','Proposed retention preference; deletion requires confirmation.']]
};
let category='Video', saved={},draft={};const defaults={};Object.entries(data).forEach(([c,rs])=>rs.forEach(r=>defaults[c+'/'+r[0]]=r[1].split('|')[0]));try{saved=JSON.parse(localStorage.getItem('uog-menu-concept')||'{}')||{}}catch{}saved={...defaults,...saved};draft={...saved};
const $=id=>document.getElementById(id);function changed(){return Object.keys(defaults).filter(k=>draft[k]!==saved[k]).length}function status(){const n=changed();$('status').textContent=n?`${n} unsaved change${n===1?'':'s'}`:'All changes saved';$('apply').disabled=$('discard').disabled=!n}
function render(){ $('categories').replaceChildren();Object.keys(data).forEach(c=>{const b=document.createElement('button');b.textContent=c;b.setAttribute('aria-pressed',c===category);b.onclick=()=>{category=c;$('search').value='';render()};$('categories').append(b)});$('rows').replaceChildren();const q=$('search').value.toLowerCase();$('section').textContent=q?'Search results':category;let count=0;Object.entries(data).forEach(([c,rs])=>rs.forEach(([name,options,help])=>{if(q?!(name+' '+help+' '+c).toLowerCase().includes(q):c!==category)return;count++;const key=c+'/'+name,row=document.createElement('div'),label=document.createElement('label'),small=document.createElement('small'),select=document.createElement('select');row.className='row';select.id='setting-'+Object.keys(defaults).indexOf(key);label.htmlFor=select.id;label.textContent=name;small.textContent=(q?c+' · ':'')+help;label.append(small);options.split('|').forEach(v=>{const o=document.createElement('option');o.textContent=v;select.append(o)});select.value=draft[key];select.onchange=()=>{draft[key]=select.value;status()};row.append(label,select);$('rows').append(row)}));if(!count)$('rows').textContent='No matching settings.';status()}
$('open').onclick=()=>{$('home').hidden=true;$('settings').hidden=false;render();$('search').focus()};$('apply').onclick=()=>{try{localStorage.setItem('uog-menu-concept',JSON.stringify(draft));saved={...draft};status()}catch{$('status').textContent='Could not save preferences in this browser.'}};$('discard').onclick=()=>{draft={...saved};render()};$('reset').onclick=()=>{data[category].forEach(r=>draft[category+'/'+r[0]]=defaults[category+'/'+r[0]]);render()};$('search').oninput=render;$('back').onclick=()=>{if(changed()){show('Unsaved changes','Apply or discard your changes before returning to the home screen.');return}$('settings').hidden=true;$('home').hidden=false;$('open').focus()};function show(title,message){$('dialogTitle').textContent=title;$('dialogText').textContent=message;$('dialog').showModal()}document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>show(b.dataset.demo,'This is a menu design preview. This action will connect to the game in the Unreal implementation.'));$('closeDialog').onclick=()=>$('dialog').close();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dialog').open&&!$('settings').hidden){e.preventDefault();$('back').click()}});
</script>
</html>
