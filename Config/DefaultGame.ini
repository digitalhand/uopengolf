[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/OpenGolfEnvironment")
+MapsToCook=(FilePath="/Game/UOpenGolf/Maps/UOpenGolf")
; AUOpenGolfHUD loads WBP_WindIndicator by a C++ soft path that no package references, so the cook would skip it.
+DirectoriesToAlwaysCook=(Path="/Game/UOpenGolf/UI")
; AvatarCatalog loads the built-in player avatars by C++ soft paths as well.
+DirectoriesToAlwaysCook=(Path="/OpenGolfSavanna/UI/Avatars")
; The engine stages only Content/Splash/Splash.bmp, and Linux also reads Icon.bmp (window icon). Both are read
; from disk before or outside the pak, so the folder ships loose.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Splash")

