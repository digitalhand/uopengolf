[SystemSettings]
; UE 5.8.4 Vulkan (bindless) can fail "ByteOffset + NumBytes <= PackedUniformBuffers.Num()" in the
; Nanite base pass during the first frames of Standalone Game. With the default (2), RDG leaves
; async pass tasks such as Nanite shading recording running past the frame, while the next scene
; update re-registers the Nanite shading bins those tasks read. 1 keeps passes parallel but awaits
; them before the graph returns.
r.RDG.ParallelExecute=1
