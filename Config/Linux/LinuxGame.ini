; Linux in-game updates (OpenGameUpdate). Overrides [OpenGameUpdate] in DefaultGame.ini on Linux.
; Quoted: Unreal's ini reader strips unquoted { and }, which would turn {version} into a literal "version".
[OpenGameUpdate]
; Portable copies: the release's archive replaces the game's folder; no password needed.
InstallerAsset="UOpenGolf-{version}-Linux-x64.tar.gz"
; Copies installed from a system package download the same format, named by /opt/uopengolf/.package-format.
PackageAsset_deb="UOpenGolf-{version}-Linux-amd64.deb"
PackageAsset_rpm="UOpenGolf-{version}-Linux-x86_64.rpm"
; Installed by both packages; pkexec runs it after asking for the administrator password.
PackageInstaller=/usr/lib/uopengolf/install-update
; It installs only a package listed in the release's SHA256SUMS, signed as SHA256SUMS.asc with the release key
; (Assets/Installer/CodeSigning.md). A release without them is offered as a manual download instead.
ChecksumListAsset=SHA256SUMS
ChecksumSignatureAsset=SHA256SUMS.asc
